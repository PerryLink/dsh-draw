name: Bug report
description: Report a bug in dsh-draw
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more precise the report, the faster we can reproduce and fix it.
  - type: input
    id: plugin-version
    attributes:
      label: Package version
      description: The `dsh-draw` version (see the plugin row in your profile or `package.json`).
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
      description: The harness (`dsh`) version, and the desktop/client version if applicable.
      placeholder: e.g. dsh 0.1.1-rc.2, DSH Desktop v2.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      description: Your operating system and Node.js version.
      placeholder: e.g. Windows 11, Node 22.19.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimal steps that trigger the bug.
      placeholder: |
        1. Configure an engine with ...
        2. Run `dsh --profile web ...`
        3. Ask the agent to generate an image ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened — error messages, empty results, session failures, etc.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Relevant logs, error output, or stack traces.
      render: shell
      placeholder: Paste logs here
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Redact before pasting.** Logs must be sanitized before submission: remove any tokens, API keys, secrets, request headers, and other credentials. **Never post secrets in a public issue.**
